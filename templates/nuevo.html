{% extends "base.html" %}
{% block titulo %}Registrar empleado{% endblock %}
{% block contenido %}
<h1>Registrar empleado</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="POST" action="/empleados/nuevo">
  <label>Código de empleado</label>
  <input type="text" name="codigo" value="{{ datos.codigo }}">
  <label>Nombre del colaborador</label>
  <input type="text" name="nombre" value="{{ datos.nombre }}">
  <label>Puesto</label>
  <input type="text" name="puesto" value="{{ datos.puesto }}">
  <label>Área o departamento</label>
  <input type="text" name="area" value="{{ datos.area }}">
  <label>Sucursal</label>
  <select name="sucursal">
    <option value="">-- Selecciona --</option>
    {% for s in sucursales %}
    <option value="{{ s }}" {% if datos.sucursal == s %}selected{% endif %}>{{ s }}</option>
    {% endfor %}
  </select>
  <label>Fecha de ingreso</label>
  <input type="date" name="fecha_ingreso" value="{{ datos.fecha_ingreso }}">
  <button type="submit">Guardar</button>
</form>
{% endblock %}
