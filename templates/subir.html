{% extends "base.html" %}
{% block titulo %}Subir documento{% endblock %}
{% block contenido %}
<h1>Subir documento de {{ empleado.nombre }}</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="POST" action="/empleados/{{ empleado.id }}/archivos/nuevo" enctype="multipart/form-data">
  <label>Tipo de documento</label>
  <select name="documento_id">
    <option value="">-- Selecciona --</option>
    {% for d in documentos %}
    <option value="{{ d.id }}" {% if datos.documento_id == d.id|string %}selected{% endif %}>{{ d.nombre }}{% if d.requiere_vencimiento %} (requiere fecha de vencimiento){% endif %}</option>
    {% endfor %}
  </select>
  <label>Fecha de vencimiento</label>
  <input type="date" name="fecha_vencimiento" value="{{ datos.fecha_vencimiento }}">
  <label>Archivo (PDF, DOC o DOCX, máximo {{ max_kb }} KB)</label>
  <input type="file" name="archivo" accept=".pdf,.doc,.docx">
  <p class="ayuda">Si ya existe el documento, se guarda como una versión nueva y la anterior se conserva.</p>
  <button type="submit">Subir</button>
  <a class="boton secundario" href="/empleados/{{ empleado.id }}/archivos">Cancelar</a>
</form>
{% endblock %}
